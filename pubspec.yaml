name: five_s_digital_assessment
description: 5S assessments, Gemba observations, and Skill Matrix for Packages Limited.
publish_to: 'none'
repository: https://github.com/Packages-Limited/5s-assessment
version: 1.0.11+12

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  cupertino_icons: ^1.0.2
  image_picker: ^1.0.4
  provider: ^6.1.5+1
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.7
  form_validator: 2.1.1
  intl: ^0.20.2
  connectivity_plus: ^6.1.4
  path_provider: ^2.1.5
  pdf: ^3.11.3
  share_plus: ^10.1.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/company_ca.crt
